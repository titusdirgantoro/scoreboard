name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: scoreboard
          POSTGRES_PASSWORD: scoreboard
          POSTGRES_DB: scoreboard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scoreboard"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://scoreboard:scoreboard@localhost:5432/scoreboard_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: migrasi naik → turun → naik
        run: |
          GOOSE="go run github.com/pressly/goose/v3/cmd/goose@latest -dir db/migrations postgres $DATABASE_URL"
          $GOOSE up
          $GOOSE reset
          $GOOSE up
      - name: tes integrasi
        run: go test -tags integration ./...

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
