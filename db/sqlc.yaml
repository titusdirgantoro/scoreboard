# sqlc: bangkitkan kode Go bertipe dari query SQL. Jalankan: make sqlc
# Dokumentasi: https://docs.sqlc.dev
version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "queries"
    gen:
      go:
        package: "dbgen"
        out: "../internal/infra/db/dbgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
