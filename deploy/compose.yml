# Satu-satunya lingkungan: produksi (ADR-0008). Repo di /opt/scoreboard di-mount
# read-only ke container (ADR-0009): perubahan yang sudah di-commit diterapkan dengan
# restart container (`make deploy`, atau `docker compose restart api worker`).
# Project: scoreboard · env: ../.env · semua port diikat ke 127.0.0.1; publik lewat Caddy edge.
name: scoreboard

x-app: &app
  image: scoreboard-runtime:latest
  env_file: ../.env
  environment:
    APP_ENV: prod
    HTTP_ADDR: 0.0.0.0:8080
    DATABASE_URL: postgres://scoreboard:${POSTGRES_PASSWORD}@postgres:5432/scoreboard?sslmode=disable
    REMBG_URL: http://rembg:7000
    # commit = hanya kode yang sudah di-commit (HEAD) yang dijalankan; worktree = isi folder apa adanya
    SOURCE_MODE: ${SOURCE_MODE:-commit}
    BACKUP_DIR: /backups
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18}
    restart: unless-stopped
    environment:
      POSTGRES_USER: scoreboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: scoreboard
    # Mount di /var/lib/postgresql supaya cocok untuk image 16 maupun 18.
    volumes:
      - pgdata:/var/lib/postgresql
    # Hanya localhost: dipakai psql, goose, dan database uji scoreboard_test (make test-integration).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoreboard -d scoreboard"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb

  api:
    <<: *app
    build:
      context: ..
      dockerfile: deploy/docker/runtime.Dockerfile
      args:
        PG_MAJOR: ${PG_MAJOR:-18}
    command: ["run", "api"]
    volumes:
      - ..:/src:ro
      - api-work:/work
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - npm-cache:/root/.npm
      - /var/backups/scoreboard:/backups
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 300s # start pertama mengompilasi web + Go

  worker:
    <<: *app
    pull_policy: never # memakai image yang di-build oleh service api
    command: ["run", "worker"]
    volumes:
      - ..:/src:ro
      - worker-work:/work
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build

  imgproxy:
    image: darthsim/imgproxy:latest
    restart: unless-stopped
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY:?isi IMGPROXY_KEY di .env}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?isi IMGPROXY_SALT di .env}
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: ${S3_ENDPOINT:-}
      IMGPROXY_S3_REGION: ${S3_REGION:-}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-}
      IMGPROXY_ENFORCE_WEBP: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: "40"
    ports:
      - "127.0.0.1:8090:8080"

  rembg:
    image: danielgatis/rembg:latest
    restart: unless-stopped
    command: ["s", "--host", "0.0.0.0", "--port", "7000"]
    profiles: ["media"]
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 2g }

volumes:
  pgdata:
  api-work:
  worker-work:
  go-mod:
  go-build:
  npm-cache:
